name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Binaries
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Extract Tag Version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Building version ${TAG}"

      - name: Prepare dist directory
        run: mkdir -p dist

      - name: Build Windows amd64 Binary
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          go build -mod=vendor -ldflags "-s -w -X main.Version=${TAG} -X main.Commit=${{ github.sha }} -X main.BuildDate=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" -o dist/tally-mcp.exe ./cmd/tally-mcp
          cd dist
          zip tally-mcp-windows-amd64.zip tally-mcp.exe ../config.example.yaml ../README.md ../LICENSE
          cp tally-mcp.exe tally-mcp-windows-amd64.exe
          cd ..

      - name: Build Windows arm64 Binary
        env:
          GOOS: windows
          GOARCH: arm64
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          go build -mod=vendor -ldflags "-s -w -X main.Version=${TAG} -X main.Commit=${{ github.sha }} -X main.BuildDate=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" -o dist/tally-mcp-arm64.exe ./cmd/tally-mcp
          cd dist
          zip tally-mcp-windows-arm64.zip tally-mcp-arm64.exe ../config.example.yaml ../README.md ../LICENSE
          cp tally-mcp-arm64.exe tally-mcp-windows-arm64.exe
          cd ..

      - name: Build Linux amd64 Binary
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          go build -mod=vendor -ldflags "-s -w -X main.Version=${TAG} -X main.Commit=${{ github.sha }} -X main.BuildDate=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" -o dist/tally-mcp ./cmd/tally-mcp
          cd dist
          tar -czf tally-mcp-linux-amd64.tar.gz tally-mcp ../config.example.yaml ../README.md ../LICENSE
          cp tally-mcp tally-mcp-linux-amd64
          cd ..

      - name: Build macOS (darwin) Binaries
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          # macOS Apple Silicon
          GOOS=darwin GOARCH=arm64 go build -mod=vendor -ldflags "-s -w -X main.Version=${TAG} -X main.Commit=${{ github.sha }} -X main.BuildDate=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" -o dist/tally-mcp-darwin-arm64 ./cmd/tally-mcp
          # macOS Intel
          GOOS=darwin GOARCH=amd64 go build -mod=vendor -ldflags "-s -w -X main.Version=${TAG} -X main.Commit=${{ github.sha }} -X main.BuildDate=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" -o dist/tally-mcp-darwin-amd64 ./cmd/tally-mcp
          cd dist
          tar -czf tally-mcp-darwin-arm64.tar.gz tally-mcp-darwin-arm64 ../config.example.yaml ../README.md ../LICENSE
          tar -czf tally-mcp-darwin-amd64.tar.gz tally-mcp-darwin-amd64 ../config.example.yaml ../README.md ../LICENSE
          cd ..

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Release ${{ steps.vars.outputs.tag }}
          tag_name: ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/tally-mcp-windows-amd64.zip
            dist/tally-mcp-windows-amd64.exe
            dist/tally-mcp-windows-arm64.zip
            dist/tally-mcp-windows-arm64.exe
            dist/tally-mcp-linux-amd64.tar.gz
            dist/tally-mcp-linux-amd64
            dist/tally-mcp-darwin-arm64.tar.gz
            dist/tally-mcp-darwin-arm64
            dist/tally-mcp-darwin-amd64
            dist/checksums.txt

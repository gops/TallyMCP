# Tally ERP & TallyPrime MCP Server Configuration
# MIT Licensed Open Source Project

server:
  # Network address to listen on for MCP clients.
  # "0.0.0.0:8080" binds to all network interfaces, allowing any device on your LAN to connect.
  # Use "127.0.0.1:8080" to only allow connections from the same machine.
  listen_address: "0.0.0.0:8080"

  # Transport mode:
  # - "sse": HTTP network mode (exposes both modern Streamable HTTP /mcp and legacy /sse)
  # - "stdio": Standard I/O (for local CLI / desktop agents spawning the exe directly)
  transport: "sse"

  # Default payload serialization format for MCP tool responses:
  # - "toon": Token-Oriented Object Notation (reduces token consumption by 40% to 60%, default)
  # - "compact_json": Standard JSON stripped of unnecessary whitespace
  payload_format: "toon"

  # Read-only mode: blocks mutating MCP tools (e.g. tally_create_ledger, tally_create_voucher)
  read_only: false

tally:
  # HTTP address where Tally ERP 9 or TallyPrime is running.
  # To enable in Tally:
  #   - TallyPrime: F1 (Help) -> Settings -> Connectivity -> Client/Server Configuration -> Tally is acting as: Both -> Port: 9000
  #   - Tally ERP 9: F12 (Configure) -> Advanced Configuration -> Tally is acting as: Both -> Port: 9000
  url: "http://localhost:9000"

  # Request timeout in seconds for Tally responses
  timeout_seconds: 30

  # Specific company name (leave empty to query whichever company is currently open in Tally)
  default_company: ""

  # Optional path to tally.exe / TallyPrime executable (e.g. "C:\\Program Files\\TallyPrime\\tally.exe").
  # Leave empty to automatically detect standard TallyPrime / Tally ERP 9 installation paths.
  exe_path: ""

  # Automatically start Tally if not running when an MCP request arrives or when server starts
  auto_start: false

auth:
  # Enable authentication to prevent unauthorized devices on your LAN from accessing Tally
  enabled: false

  # Secret token required from MCP clients.
  # MCP clients can provide this via:
  #   1. Header: Authorization: Bearer <api_key>
  #   2. Header: X-API-Key: <api_key>
  #   3. Query parameter: http://<ip>:8080/mcp?token=<api_key> (or /sse?token=<api_key>)
  api_key: "change-this-to-a-secure-random-string"

  # Set to true to reject ?token= / ?api_key= query parameters and only accept header auth
  disable_query_token: false

relay:
  # Enable outbound WebSocket relay to 1erp.work (only connects after logging in via --1erp-login)
  enabled: true
  # 1erp.work server URL (must be https:// for non-localhost)
  server_url: "https://1erp.work"
  # Keep false for safety: relayed requests from 1erp.work run in read-only mode by default
  allow_writes: false

updater:
  # GitHub repository coordinates to check for new releases (owner/repo)
  github_repo: "gops/TallyMCP"

  # Automatically check for updates on application startup
  check_on_startup: true

  # Interval in seconds to check GitHub Releases for new updates (default: 300 = 5 minutes)
  check_interval_seconds: 300

  # Automatically download, install, and restart if a new release is found
  auto_apply: true

log:
  # Logging verbosity: "debug", "info", "warn", "error"
  level: "info"
